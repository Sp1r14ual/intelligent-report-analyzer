services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/analytics_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  superset-init:
    image: apache/superset:3.1.3
    container_name: superset_init_container
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: TEST_SUPERSET_SECRET_KEY_DIPLOMA_2026_VERY_SECURE
      SQLALCHEMY_DATABASE_URI: postgresql://superset:superset@postgres:5432/analytics_db
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      /bin/sh -c "
      echo '==== Running DB upgrade ====' &&
      superset db upgrade &&
      echo '==== Creating admin user ====' &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.org --password admin || true &&
      echo '==== Initializing Superset ====' &&
      superset init &&
      echo '==== Superset init complete! ===='
      "

  superset:
    image: apache/superset:3.1.3
    container_name: superset_container
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: TEST_SUPERSET_SECRET_KEY_DIPLOMA_2026_VERY_SECURE
      SQLALCHEMY_DATABASE_URI: postgresql://superset:superset@postgres:5432/analytics_db
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s
  
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama_container
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command:
      - "-m"
      - "/models/YandexGPT-5-Lite-8B-instruct-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "8192"
      - "-ngl"
      - "18"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  app:
    build: .
    container_name: app_container
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      llama:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: analytics_db
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      SUPERSET_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: http://localhost:8088
      LLM_BASE_URL: http://llama:8080

volumes:
  pgdata: