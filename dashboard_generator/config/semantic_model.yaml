version: "1.0"
domain: "Университетская аналитика и отчетность (ВПО и НИОКР)"
target_database: "PostgreSQL"
target_schema: "analytics"

business_rules:
  allowed_schemas:
    - "analytics"
  forbidden_commands:
    - "INSERT"
    - "UPDATE"
    - "DELETE"
    - "DROP"
    - "ALTER"
    - "CREATE"
    - "TRUNCATE"
    - "GRANT"
    - "REVOKE"
    - "COPY"
    - "EXECUTE"
  forbidden_terms:
    - "fio"
    - "passport"
    - "surname"
    - "firstname"
    - "phone"
    - "email"
    - "snils"
    - "inn"
  guidelines:
    - "Используйте ТОЛЬКО витрины из схемы analytics."
    - "Для каждого графика формируйте самостоятельный корректный SELECT/WITH-запрос."
    - "Запрещены подзапросы к несуществующим системным таблицам."
    - "Названия колонок в GROUP BY и метриках должны точно совпадать со столбцами в SELECT."

views:
  analytics.v_students_by_faculty_form:
    description: "Распределение студентов по факультетам и формам обучения (очная, заочная, очно-заочная)."
    columns:
      - name: "faculty_code"
        type: "VARCHAR"
        description: "Код/аббревиатура факультета (ФПМИ, АВТФ, ФЭН, РЭФ, ФЛА)"
        role: "dimension"
      - name: "faculty_name"
        type: "VARCHAR"
        description: "Полное наименование факультета"
        role: "dimension"
      - name: "training_form"
        type: "VARCHAR"
        description: "Форма обучения (Очная форма, Заочная форма, Очно-заочная)"
        role: "dimension"
      - name: "student_count"
        type: "INTEGER"
        description: "Количество студентов"
        role: "metric"
      - name: "year"
        type: "INTEGER"
        description: "Отчетный год (2025)"
        role: "dimension"

  analytics.v_faculty_totals:
    description: "Агрегированная сводка численности студентов по факультетам (очная, заочная, вечерняя и всего)."
    columns:
      - name: "faculty_code"
        type: "VARCHAR"
        description: "Код факультета"
        role: "dimension"
      - name: "faculty_name"
        type: "VARCHAR"
        description: "Наименование факультета"
        role: "dimension"
      - name: "full_time_count"
        type: "INTEGER"
        description: "Численность на очной форме"
        role: "metric"
      - name: "extramural_count"
        type: "INTEGER"
        description: "Численность на заочной форме"
        role: "metric"
      - name: "part_time_count"
        type: "INTEGER"
        description: "Численность на очно-заочной форме"
        role: "metric"
      - name: "total_students"
        type: "INTEGER"
        description: "Общая численность студентов факультета"
        role: "metric"

  analytics.v_students_by_level:
    description: "Контингент обучающихся по уровням высшего образования (бакалавриат, специалитет, магистратура, аспирантура)."
    columns:
      - name: "education_level"
        type: "VARCHAR"
        description: "Уровень образования"
        role: "dimension"
      - name: "students_2024"
        type: "INTEGER"
        description: "Количество обучающихся в 2024 году"
        role: "metric"
      - name: "students_2025"
        type: "INTEGER"
        description: "Количество обучающихся в 2025 году"
        role: "metric"
      - name: "growth_pct"
        type: "NUMERIC"
        description: "Процент прироста контингента"
        role: "metric"

  analytics.v_rnd_funding:
    description: "Финансирование научных исследований и разработок (НИОКР) по источникам поступлений."
    columns:
      - name: "funding_source"
        type: "VARCHAR"
        description: "Источник финансирования (Госзадание, РНФ, хоздоговоры, региональные гранты)"
        role: "dimension"
      - name: "amount_2024_mln"
        type: "NUMERIC"
        description: "Сумма за 2024 год (млн руб.)"
        role: "metric"
      - name: "amount_2025_mln"
        type: "NUMERIC"
        description: "Сумма за 2025 год (млн руб.)"
        role: "metric"
      - name: "share_2025_pct"
        type: "NUMERIC"
        description: "Доля в общем объеме финансирования 2025 года (%)"
        role: "metric"

  analytics.v_publications:
    description: "Динамика научных публикаций по индексациям (ВАК, Scopus, Web of Science, РИНЦ, Монографии)."
    columns:
      - name: "index_type"
        type: "VARCHAR"
        description: "Тип индексации / системы"
        role: "dimension"
      - name: "year"
        type: "INTEGER"
        description: "Год публикации (2023, 2024, 2025)"
        role: "dimension"
      - name: "publication_count"
        type: "INTEGER"
        description: "Количество публикаций"
        role: "metric"

  analytics.v_faculty_labs_efficiency:
    description: "Показатели результативности научно-исследовательских лабораторий по факультетам."
    columns:
      - name: "faculty_code"
        type: "VARCHAR"
        description: "Код факультета"
        role: "dimension"
      - name: "faculty_name"
        type: "VARCHAR"
        description: "Наименование факультета"
        role: "dimension"
      - name: "lab_name"
        type: "VARCHAR"
        description: "Название лаборатории или научного центра"
        role: "dimension"
      - name: "funding_mln"
        type: "NUMERIC"
        description: "Объем финансирования лаборатории (млн руб.)"
        role: "metric"
      - name: "articles_count"
        type: "INTEGER"
        description: "Количество статей лаборатории"
        role: "metric"
      - name: "young_researchers"
        type: "INTEGER"
        description: "Количество молодых исследователей в лаборатории"
        role: "metric"

  analytics.v_stipend_fund:
    description: "Структура выплат стипендиального фонда университета."
    columns:
      - name: "stipend_type"
        type: "VARCHAR"
        description: "Вид стипендии или выплаты"
        role: "dimension"
      - name: "amount_2024_mln"
        type: "NUMERIC"
        description: "Выплаты за 2024 год (млн руб.)"
        role: "metric"
      - name: "amount_2025_mln"
        type: "NUMERIC"
        description: "Выплаты за 2025 год (млн руб.)"
        role: "metric"
      - name: "share_2025_pct"
        type: "NUMERIC"
        description: "Доля в стипендиальном фонде 2025 года (%)"
        role: "metric"

  analytics.v_faculty_overview:
    description: "Межфакультетское сопоставление: численность студентов, финансирование лабораторий и статьи."
    columns:
      - name: "faculty_code"
        type: "VARCHAR"
        description: "Код факультета"
        role: "dimension"
      - name: "faculty_name"
        type: "VARCHAR"
        description: "Наименование факультета"
        role: "dimension"
      - name: "total_students"
        type: "INTEGER"
        description: "Общее число студентов"
        role: "metric"
      - name: "labs_funding_mln"
        type: "NUMERIC"
        description: "Финансирование лабораторий факультета (млн руб.)"
        role: "metric"
      - name: "total_lab_articles"
        type: "INTEGER"
        description: "Суммарное количество статей лабораторий"
        role: "metric"
      - name: "total_young_researchers"
        type: "INTEGER"
        description: "Количество молодых ученых"
        role: "metric"
